# OpenCode Live: the `opencode` subagent tool plus a live trace panel served by
# the DSH Web host at the configured `path` (default /opencode-live).
- insert:
    - id: opencode-live
      name: dsh-opencode-live
      config:
        # Omit `command` to use $OPENCODE_BIN, ~/.opencode/bin/opencode, or PATH.
        args: ['acp']
        # How OpenCode's own permission prompts are answered:
        #   ask    – route each one to the DSH user (default)
        #   allow  – auto-approve; OpenCode's explicit `deny` rules still apply
        #   reject – read-only child
        permission: ask
        # Used when `ask` cannot reach an answerer (no open turn / none composed).
        askFallback: reject
        # ACP starts the session on the provider's default model, not on the
        # model the preset assigns to its default agent. Set `model` here (or in
        # the Plugins settings page) to pin it. Left unset in the bundle so a
        # checkout carries no personal model; the profile layer holds the value.

    - id: tool-opencode-live
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: opencode-live
        toolName: opencode
        maxDepth: provider-managed
